<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jacobleu Art Gallery · Bienvenue</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <div id="hdr"></div>
  <main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script>
// Visitor sign-in page: this is where the QR code at the entrance leads.
let done = null, busy = false;

window.render = function () {
  $("#hdr").innerHTML = header("checkin", false);
  const p = ["expo", "show", "cowork", "event"];
  const body = done
    ? `<div class="thanks"><div class="big">${done.n > 1 ? done.n : "✓"}</div>
        <h3>${esc(t("thanks", { n: done.first }))}</h3>
        <p style="margin:0;color:var(--muted)">${done.n > 1 ? t("visitN", { n: done.n }) : t("first")}</p>
        <button class="btn ghost" id="again" type="button">${t("next")}</button></div>`
    : `<form id="ci" novalidate>
        <label for="f-name">${t("fName")}<input id="f-name" type="text" autocomplete="name" placeholder="Kouassi Aya" required></label>
        <label for="f-role">${t("fRole")}<input id="f-role" type="text" autocomplete="organization-title" placeholder="Architecte"></label>
        <label for="f-phone">${t("fPhone")}<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07 98 28 64 50" required></label>
        <label for="f-email">${t("fEmail")}<input id="f-email" type="email" autocomplete="email" placeholder="aya.kouassi@gmail.com"></label>
        <div style="display:grid;gap:6px"><span style="font-size:13px;font-weight:500">${t("fPurpose")}</span>
          <div class="chips">${p.map((x, i) => `<label><input type="radio" name="purpose" id="f-p-${x}" value="${x}" ${i === 0 ? "checked" : ""}><span>${t("p_" + x)}</span></label>`).join("")}</div></div>
        <label class="check" for="f-optin"><input id="f-optin" type="checkbox"><span>${t("optin")}</span></label>
        <div class="err" id="ferr" role="alert"></div>
        <button class="btn" type="submit" ${CONFIGURED ? "" : "disabled"}>${t("submit")}</button>
        <p class="small" style="margin:0">${t("privacy")}</p>
      </form>`;
  $("#app").innerHTML = `${CONFIGURED ? "" : setupNotice()}
    <div class="phone solo"><div class="eyebrow">${t("welcome")} · Jacobleu Art Gallery</div><h3>${t("formTitle")}</h3>${body}</div>`;
};

document.addEventListener("submit", async e => {
  if (e.target.id !== "ci" || busy) return;
  e.preventDefault();
  const name = $("#f-name").value.trim(), email = $("#f-email").value.trim(), phone = digits($("#f-phone").value);
  const err = $("#ferr"); err.textContent = "";
  if (name.length < 2) return err.textContent = t("errName");
  if (phone.length < 8 || phone.length > 15) return err.textContent = t("errPhone");
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = t("errEmail");
  busy = true; e.target.querySelector("button[type=submit]").disabled = true;
  const { data, error } = await sb.rpc("check_in", {
    p_name: name, p_occupation: $("#f-role").value.trim(), p_email: email, p_phone: phone,
    p_purpose: (document.querySelector("input[name=purpose]:checked") || {}).value || "expo",
    p_optin: $("#f-optin").checked
  });
  busy = false;
  if (error) { err.textContent = t("netErr"); e.target.querySelector("button[type=submit]").disabled = false; return; }
  done = { first: name.split(" ").slice(-1)[0], n: data || 1 };
  render();
});
document.addEventListener("click", e => { if (e.target.id === "again") { done = null; render(); $("#f-name").focus(); } });

render();
</script>
</body>
</html>
